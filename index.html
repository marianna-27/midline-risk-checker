<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミッドライン合流リスクチェッカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }

        /* Modern & Drastic Modal CSS */
        .calc-modal-container {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
            color: #f8fafc;
        }
        .calc-card {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #334155;
        }
        .gradient-border-purple { border-left: 4px solid #a855f7; }
        .gradient-border-green { border-left: 4px solid #10b981; }

        .card-step-badge {
            position: absolute; top: 14px; right: 16px;
            background: #0284c7; color: #fff;
            font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 12px;
            letter-spacing: 0.05em;
        }
        .card-step-badge.purple { background: #9333ea; }
        .card-step-badge.green { background: #059669; }

        /* 数式・分数スタイル */
        .math-box {
            background: #090d16; padding: 14px; border-radius: 8px;
            font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.9rem; color: #e2e8f0;
            border: 1px solid #1e293b;
        }
        .fraction-box {
            display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 4px;
        }
        .fraction-body { display: inline-flex; flex-direction: column; text-align: center; }
        .numerator { border-bottom: 1.5px solid #64748b; padding-bottom: 3px; color: #38bdf8; }
        .denominator { padding-top: 3px; color: #f43f5e; }

        .ph-split-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .ph-calc-card { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .code-line { background: #1e293b; padding: 6px 10px; border-radius: 6px; color: #a7f3d0; font-family: monospace; }
        
        .result-pill-purple {
            background: rgba(168, 85, 247, 0.15); border: 1px solid #a855f7; color: #e9d5ff;
            padding: 10px 16px; border-radius: 20px; font-weight: 700;
        }
        .result-pill-green {
            background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #a7f3d0;
            padding: 10px 16px; border-radius: 20px; font-weight: 700;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- ヘッダー -->
        <header class="bg-white p-6 rounded-xl shadow-md border-l-8 border-indigo-600">
            <h1 class="text-2xl font-bold text-indigo-900">🩺 ミッドライン合流リスクチェッカー</h1>
            <p class="text-sm text-slate-500 mt-1">メイン輸液と側管2系統（原液・希釈）の合流部における pH・浸透圧変化を計算します。</p>
        </header>

        <!-- 入力エリア (3カラム) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- メイン輸液設定 -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-4 border-t-4 border-blue-400">
                <h2 class="text-lg font-bold text-slate-700 border-b pb-2">💧 メイン輸液設定</h2>
                <div>
                    <label class="block text-sm font-medium text-slate-600">投与速度 (mL/h)</label>
                    <input type="number" id="mainFlow" value="100" min="0" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">メイン液 pH</label>
                    <input type="number" id="mainPh" value="6.0" step="0.1" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <span class="text-xs text-slate-400">※生食・5%ブドウ糖液 は約 6.0</span>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">メイン液 浸透圧比</label>
                    <input type="number" id="mainOsm" value="1.0" step="0.1" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- 側管1設定 -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-4 border-t-4 border-purple-400">
                <h2 class="text-lg font-bold text-slate-700 border-b pb-2">💉 側管 1</h2>
                <div>
                    <label class="block text-sm font-medium text-slate-600">薬剤選択</label>
                    <select id="drugSelect1" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-purple-500 outline-none bg-white text-sm"></select>
                </div>
                
                <div id="sideDetail1" class="space-y-4 transition-all">
                    <div class="p-3 bg-purple-50/50 rounded-lg border border-purple-100 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-purple-900">溶解・希釈液</label>
                            <select id="diluentSelect1" class="mt-1 w-full p-1.5 border rounded focus:ring-2 focus:ring-purple-500 outline-none bg-white text-xs">
                                <option value="none" selected>なし（原液）</option>
                                <option value="saline">生理食塩液 (pH 6.0/浸透圧比 1.0)</option>
                                <option value="glucose5">5%ブドウ糖 (pH 4.5/浸透圧比 1.0)</option>
                                <option value="water">注射用水 (pH 6.0/浸透圧比 0.0)</option>
                            </select>
                        </div>
                        <div id="dilutionAmountArea1" class="grid grid-cols-2 gap-3 text-xs">
                            <div>
                                <label class="block text-slate-600 font-medium">薬剤原液 (mL)</label>
                                <input type="number" id="drugVol1" value="10" min="0.1" step="0.1" class="mt-1 w-full p-1.5 border rounded focus:ring-2 focus:ring-purple-500 outline-none bg-white">
                            </div>
                            <div>
                                <label class="block text-slate-600 font-medium">希釈液 (mL)</label>
                                <input type="number" id="diluentVol1" value="90" min="0" step="1" class="mt-1 w-full p-1.5 border rounded focus:ring-2 focus:ring-purple-500 outline-none bg-white">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">投与速度 (mL/h)</label>
                        <input type="number" id="sideFlow1" value="0" min="0" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
                <div id="drugSingleInfo1" class="p-2 bg-slate-50 rounded text-[11px] space-y-1 text-slate-600 border">なし（未選択）</div>
            </div>

            <!-- 側管2設定 -->
            <div class="bg-white p-6 rounded-xl shadow-md space-y-4 border-t-4 border-emerald-400">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-lg font-bold text-slate-700">💉 側管 2</h2>
                    <div class="text-xs text-slate-500">※未使用時は「なし」</div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">薬剤選択</label>
                    <select id="drugSelect2" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm"></select>
                </div>
                
                <div id="sideDetail2" class="space-y-4 transition-all">
                    <div class="p-3 bg-emerald-50/50 rounded-lg border border-emerald-100 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-emerald-900">溶解・希釈液</label>
                            <select id="diluentSelect2" class="mt-1 w-full p-1.5 border rounded focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-xs">
                                <option value="none" selected>なし（原液）</option>
                                <option value="saline">生理食塩液 (pH 6.0/浸透圧比 1.0)</option>
                                <option value="glucose5">5%ブドウ糖 (pH 4.5/浸透圧比 1.0)</option>
                                <option value="water">注射用水 (pH 6.0/浸透圧比 0.0)</option>
                            </select>
                        </div>
                        <div id="dilutionAmountArea2" class="grid grid-cols-2 gap-3 text-xs">
                            <div>
                                <label class="block text-slate-600 font-medium">薬剤原液 (mL)</label>
                                <input type="number" id="drugVol2" value="5" min="0.1" step="0.1" class="mt-1 w-full p-1.5 border rounded focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            </div>
                            <div>
                                <label class="block text-slate-600 font-medium">希釈液 (mL)</label>
                                <input type="number" id="diluentVol2" value="45" min="0" step="1" class="mt-1 w-full p-1.5 border rounded focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600">投与速度 (mL/h)</label>
                        <input type="number" id="sideFlow2" value="0" min="0" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>
                <div id="drugSingleInfo2" class="p-2 bg-slate-50 rounded text-[11px] space-y-1 text-slate-600 border">なし（未選択）</div>
            </div>

        </div>

        <!-- 判定・シグナル表示エリア -->
        <div id="riskCard" class="bg-white p-6 rounded-xl shadow-md transition-all duration-300">
            <div class="flex items-center justify-between border-b pb-4">
                <div>
                    <span class="text-xs text-slate-400 font-bold tracking-wider uppercase">3経路 合流部リスク判定</span>
                    <h3 id="riskTitle" class="text-2xl font-black mt-1">--</h3>
                </div>
                <div id="riskBadge" class="px-4 py-2 rounded-full text-lg font-bold text-white bg-slate-400">判定中</div>
            </div>
            
            <p id="riskDescription" class="mt-3 text-sm text-slate-600">--</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                <!-- pHカード -->
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="text-xs text-slate-500 font-medium">合流部 予測 pH</div>
                    <div id="phResult" class="text-3xl font-extrabold text-slate-800 mt-1">--</div>
                    <div class="text-xs text-slate-400 mt-1">基準域: 4.1 ～ 9.0</div>
                </div>

                <!-- 浸透圧カード -->
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <div class="text-xs text-slate-500 font-medium">合流部 予測 浸透圧比</div>
                    <div id="osmResult" class="text-3xl font-extrabold text-slate-800 mt-1">--</div>
                    <div class="text-xs text-slate-400 mt-1">基準値: 3.0 以下</div>
                </div>
            </div>

            <!-- 計算過程を見るボタン -->
            <div class="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                <button id="openCalcModal" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-sm rounded-lg transition-colors flex items-center space-x-2">
                    <span>📊 計算過程・内訳の詳細を見る</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ポップアップ（モーダル） -->
    <div id="calcModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50 p-4">
        <div class="calc-modal-container rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <!-- モーダルヘッダー -->
            <div class="p-5 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg text-sky-400 flex items-center gap-2">
                        <span>⚡</span> 合流部スペック & 計算プロセスの詳細検証
                    </h3>
                    <p class="text-xs text-slate-400 mt-0.5">各系統の流出データから加重平均・水素イオン濃度平均を精密算出</p>
                </div>
                <button id="closeCalcModal" class="text-slate-400 hover:text-white text-2xl font-bold px-2">&times;</button>
            </div>
            <!-- モーダルコンテンツ -->
            <div id="calcModalContent" class="p-6 overflow-y-auto space-y-5 text-sm text-slate-300">
                <!-- JSで動的に追加されます -->
            </div>
            <!-- モーダルフッター -->
            <div class="p-4 bg-slate-900 border-t border-slate-800 text-right">
                <button id="closeCalcModalBtn" class="px-6 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-lg text-sm shadow-lg transition-all">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        let drugData = [];

        const DILUENT_SPECS = {
            none: { name: "なし", ph: null, osm: null },
            saline: { name: "生食", ph: 6.0, osm: 1.0 },
            glucose5: { name: "5%ツッカー", ph: 4.5, osm: 1.0 },
            water: { name: "注水", ph: 6.0, osm: 0.0 }
        };

        async function loadDrugData() {
            try {
                const cacheBuster = new Date().getTime();
                const response = await fetch(`drugs_data.json?t=${cacheBuster}`);
                
                if (!response.ok) throw new Error('Network response was not ok');
                drugData = await response.json();
                
                initSelect(document.getElementById('drugSelect1'));
                initSelect(document.getElementById('drugSelect2'));
                updateCalculation();
            } catch (error) {
                console.error('薬剤データの読み込みに失敗しました:', error);
                alert('drugs_data.json の読み込みに失敗しました。');
            }
        }

        function initSelect(selectElement) {
            selectElement.innerHTML = "";
            const noneOption = document.createElement('option');
            noneOption.value = "none";
            noneOption.textContent = "なし（未選択）";
            noneOption.selected = true;
            selectElement.appendChild(noneOption);

            drugData.forEach((drug, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = drug.id_name;
                selectElement.appendChild(option);
            });
        }

        function getSideElements(idx) {
            return {
                drugSel: document.getElementById(`drugSelect${idx}`),
                dilSel: document.getElementById(`diluentSelect${idx}`),
                drugVol: document.getElementById(`drugVol${idx}`),
                dilVol: document.getElementById(`diluentVol${idx}`),
                flow: document.getElementById(`sideFlow${idx}`),
                info: document.getElementById(`drugSingleInfo${idx}`),
                area: document.getElementById(`dilutionAmountArea${idx}`),
                detailArea: document.getElementById(`sideDetail${idx}`)
            };
        }

        const side1 = getSideElements(1);
        const side2 = getSideElements(2);
        const mainFlowInput = document.getElementById('mainFlow');
        const mainPhInput = document.getElementById('mainPh');
        const mainOsmInput = document.getElementById('mainOsm');

        // モーダルの開閉イベント
        const calcModal = document.getElementById('calcModal');
        document.getElementById('openCalcModal').addEventListener('click', () => calcModal.classList.remove('hidden'));
        document.getElementById('closeCalcModal').addEventListener('click', () => calcModal.classList.add('hidden'));
        document.getElementById('closeCalcModalBtn').addEventListener('click', () => calcModal.classList.add('hidden'));

        [side1, side2].forEach(side => {
            const updateUIState = () => {
                const isNoneDrug = side.drugSel.value === 'none';
                side.detailArea.classList.toggle('opacity-40', isNoneDrug);
                side.detailArea.classList.toggle('pointer-events-none', isNoneDrug);

                const isNoneDiluent = side.dilSel.value === 'none';
                side.area.classList.toggle('opacity-40', isNoneDiluent);
                side.area.classList.toggle('pointer-events-none', isNoneDiluent);
            };

            side.drugSel.addEventListener('change', () => {
                if (side.drugSel.value !== 'none') {
                    side.drugVol.value = drugData[side.drugSel.value].default_vol || 10;
                    if (parseFloat(side.flow.value) === 0) side.flow.value = 10;
                } else {
                    side.flow.value = 0;
                }
                updateUIState();
                updateCalculation();
            });

            side.dilSel.addEventListener('change', () => {
                updateUIState();
                updateCalculation();
            });

            [side.drugVol, side.dilVol, side.flow].forEach(input => input.addEventListener('input', updateCalculation));
            updateUIState();
        });

        [mainFlowInput, mainPhInput, mainOsmInput].forEach(i => i.addEventListener('input', updateCalculation));

        function calcSideSpecs(side) {
            if (side.drugSel.value === 'none' || drugData.length === 0) return { flow: 0, name: "未選択" };

            const flow = parseFloat(side.flow.value) || 0;
            if (flow === 0) return { flow: 0, name: drugData[side.drugSel.value].id_name };

            const drug = drugData[side.drugSel.value];
            const dilKey = side.dilSel.value;
            const dilSpec = DILUENT_SPECS[dilKey];
            const drugVol = parseFloat(side.drugVol.value) || 0;
            const dilVol = (dilKey === 'none') ? 0 : (parseFloat(side.dilVol.value) || 0);
            const totalVol = drugVol + dilVol;

            if (totalVol === 0) return { flow: 0, name: drug.id_name };

            let phMin, phMax, osm, hMin, hMax;
            const dPhMin = drug.ph_min || 6.0;
            const dPhMax = drug.ph_max || 6.0;
            const dOsm = drug.osm_val || 1.0;
            const dPhRaw = drug.ph_raw || String(dPhMin);
            const dOsmRaw = drug.osm_raw || String(dOsm);

            if (dilKey === 'none' || dilVol === 0) {
                phMin = dPhMin; phMax = dPhMax; osm = dOsm;
                hMin = Math.pow(10, -phMin); hMax = Math.pow(10, -phMax);
                side.info.innerHTML = `<strong>原液:</strong> pH ${dPhRaw} | 浸透圧比 ${dOsmRaw}`;
            } else {
                const hDrugMin = Math.pow(10, -dPhMin);
                const hDrugMax = Math.pow(10, -dPhMax);
                const hDil = Math.pow(10, -dilSpec.ph);

                const hMixMax = (hDrugMin * drugVol + hDil * dilVol) / totalVol;
                const hMixMin = (hDrugMax * drugVol + hDil * dilVol) / totalVol;
                
                phMin = Math.min(-Math.log10(hMixMax), -Math.log10(hMixMin));
                phMax = Math.max(-Math.log10(hMixMax), -Math.log10(hMixMin));
                hMin = Math.pow(10, -phMin); hMax = Math.pow(10, -phMax);
                osm = (dOsm * drugVol + dilSpec.osm * dilVol) / totalVol;

                side.info.innerHTML = `
                    <div><strong>原液:</strong> pH ${dPhRaw} | 浸透圧比 ${dOsmRaw}</div>
                    <div class="mt-1 pt-1 border-t border-slate-200 text-indigo-800">
                        希釈後予測: pH <strong>${phMin.toFixed(2)} ～ ${phMax.toFixed(2)}</strong> | 浸透圧比 <strong>${osm.toFixed(2)}</strong>
                    </div>`;
            }
            return { flow, phMin, phMax, hMin, hMax, osm, name: drug.id_name, isDiluted: (dilKey !== 'none' && dilVol > 0) };
        }

        function updateCalculation() {
            const mainFlow = parseFloat(mainFlowInput.value) || 0;
            const mainPh = parseFloat(mainPhInput.value) || 6.0;
            const mainOsm = parseFloat(mainOsmInput.value) || 1.0;
            const hMain = Math.pow(10, -mainPh);

            const s1 = calcSideSpecs(side1);
            if (side1.drugSel.value === 'none') side1.info.innerHTML = "なし（未選択）";
            else if (s1.flow === 0) side1.info.innerHTML = "停止中 (流量 0)";

            const s2 = calcSideSpecs(side2);
            if (side2.drugSel.value === 'none') side2.info.innerHTML = "なし（未選択）";
            else if (s2.flow === 0) side2.info.innerHTML = "停止中 (流量 0)";

            const totalFlow = mainFlow + s1.flow + s2.flow;

            if (totalFlow === 0) {
                document.getElementById('phResult').textContent = "--";
                document.getElementById('osmResult').textContent = "--";
                return;
            }

            let totalHMixMax = (hMain * mainFlow);
            let totalHMixMin = (hMain * mainFlow);
            let totalOsmMix = (mainOsm * mainFlow);

            if (s1.flow > 0) {
                totalHMixMax += (s1.hMin * s1.flow);
                totalHMixMin += (s1.hMax * s1.flow);
                totalOsmMix += (s1.osm * s1.flow);
            }
            if (s2.flow > 0) {
                totalHMixMax += (s2.hMin * s2.flow);
                totalHMixMin += (s2.hMax * s2.flow);
                totalOsmMix += (s2.osm * s2.flow);
            }

            const mixPhWorst = -Math.log10(totalHMixMax / totalFlow);
            const mixPhBest = -Math.log10(totalHMixMin / totalFlow);
            
            const finalPhMin = Math.min(mixPhWorst, mixPhBest);
            const finalPhMax = Math.max(mixPhWorst, mixPhBest);
            const finalOsm = totalOsmMix / totalFlow;

            // 画面表示
            const phStr = (finalPhMin.toFixed(2) === finalPhMax.toFixed(2)) ? finalPhMin.toFixed(2) : `${finalPhMin.toFixed(2)} ～ ${finalPhMax.toFixed(2)}`;
            document.getElementById('phResult').textContent = phStr;
            document.getElementById('osmResult').textContent = finalOsm.toFixed(2);

            // リスク判定
            const riskTitle = document.getElementById('riskTitle');
            const riskBadge = document.getElementById('riskBadge');
            const riskDesc = document.getElementById('riskDescription');
            const riskCard = document.getElementById('riskCard');

            let reasons = [];
            let isDanger = false, isWarning = false;

            if (finalPhMin < 4.1) { isDanger = true; reasons.push(`強酸性 (${finalPhMin.toFixed(2)})`); }
            if (finalPhMax > 9.0) { isDanger = true; reasons.push(`強アルカリ (${finalPhMax.toFixed(2)})`); }
            if (finalOsm > 3.0) { isDanger = true; reasons.push(`高浸透圧 (${finalOsm.toFixed(2)})`); }

            if (!isDanger) {
                if (finalPhMin < 5.0 || finalPhMax > 8.0 || finalOsm > 2.0) {
                    isWarning = true; reasons.push("適正領域外");
                }
            }

            if (isDanger) {
                riskTitle.textContent = "🔴 【警告】血管障害リスク：高";
                riskTitle.className = "text-2xl font-black mt-1 text-rose-600";
                riskBadge.textContent = "🔴 警告"; riskBadge.className = "px-4 py-2 rounded-full text-sm font-bold text-white bg-rose-600";
                riskDesc.innerHTML = `<span class='font-bold text-rose-800'>ミッドライン/末梢投与は非推奨。</span> 理由: ${reasons.join(", ")}`;
                riskCard.className = "bg-white p-6 rounded-xl shadow-md border-2 border-rose-300";
            } else if (isWarning) {
                riskTitle.textContent = "🟡 【注意】血管障害リスク：あり";
                riskTitle.className = "text-2xl font-black mt-1 text-amber-600";
                riskBadge.textContent = "🟡 注意"; riskBadge.className = "px-4 py-2 rounded-full text-sm font-bold text-white bg-amber-500";
                riskDesc.innerHTML = `<span class='font-bold text-amber-800'>慎重投与。局所観察を強化。</span> 理由: ${reasons.join(", ")}`;
                riskCard.className = "bg-white p-6 rounded-xl shadow-md border-2 border-amber-300";
            } else {
                riskTitle.textContent = "🔵 安全域内";
                riskTitle.className = "text-2xl font-black mt-1 text-emerald-600";
                riskBadge.textContent = "🔵 安全"; riskBadge.className = "px-4 py-2 rounded-full text-sm font-bold text-white bg-emerald-600";
                riskDesc.textContent = "3経路合流後の予測pH・浸透圧は安全域内です。";
                riskCard.className = "bg-white p-6 rounded-xl shadow-md border-2 border-emerald-300";
            }

            // モーダル（ポップアップ）内のコンテンツ生成
            renderModalDetails({ mainFlow, mainPh, mainOsm, hMain, s1, s2, totalFlow, finalPhMin, finalPhMax, finalOsm, totalHMixMax, totalHMixMin });
        }

        // 計算詳細をポップアップ内に描画する関数（途中式完全展開UI）
        function renderModalDetails(data) {
            const container = document.getElementById('calcModalContent');
            
            // 全流量の式
            const flowTerms = [data.mainFlow];
            if (data.s1.flow > 0) flowTerms.push(data.s1.flow);
            if (data.s2.flow > 0) flowTerms.push(data.s2.flow);
            const flowFormula = flowTerms.join(" + ");

            // 浸透圧比の代入式
            const osmTerms = [`(${data.mainFlow} × ${data.mainOsm})`];
            if (data.s1.flow > 0) osmTerms.push(`(${data.s1.flow} × ${data.s1.osm.toFixed(2)})`);
            if (data.s2.flow > 0) osmTerms.push(`(${data.s2.flow} × ${data.s2.osm.toFixed(2)})`);

            // pH(最小・最大) の代入式組み立て
            const phMinTerms = [`${data.mainFlow} × 10<sup>-${data.mainPh}</sup>`];
            const phMaxTerms = [`${data.mainFlow} × 10<sup>-${data.mainPh}</sup>`];

            if (data.s1.flow > 0) {
                phMinTerms.push(`${data.s1.flow} × 10<sup>-${data.s1.phMin.toFixed(2)}</sup>`);
                phMaxTerms.push(`${data.s1.flow} × 10<sup>-${data.s1.phMax.toFixed(2)}</sup>`);
            }
            if (data.s2.flow > 0) {
                phMinTerms.push(`${data.s2.flow} × 10<sup>-${data.s2.phMin.toFixed(2)}</sup>`);
                phMaxTerms.push(`${data.s2.flow} × 10<sup>-${data.s2.phMax.toFixed(2)}</sup>`);
            }

            const avgHMaxExp = (data.totalHMixMax / data.totalFlow).toExponential(3);
            const avgHMinExp = (data.totalHMixMin / data.totalFlow).toExponential(3);

            let html = `
                <!-- STEP 1: 各系統スペック -->
                <div class="calc-card">
                    <div class="card-step-badge">STEP 1</div>
                    <h4 class="font-bold text-sky-300 text-sm mb-3">各系統の流出スペック一覧</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 text-xs">
                        <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
                            <div class="text-sky-400 font-bold mb-1">メイン輸液</div>
                            <div>流量: <strong class="text-white">${data.mainFlow} mL/h</strong></div>
                            <div>pH: <strong class="text-white">${data.mainPh}</strong></div>
                            <div>浸透圧比: <strong class="text-white">${data.mainOsm}</strong></div>
                        </div>
                        <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
                            <div class="text-purple-400 font-bold mb-1">側管 1 (${data.s1.name})</div>
                            ${data.s1.flow > 0 ? `
                                <div>流量: <strong class="text-white">${data.s1.flow} mL/h</strong></div>
                                <div>pH: <strong class="text-white">${data.s1.phMin.toFixed(2)} ～ ${data.s1.phMax.toFixed(2)}</strong></div>
                                <div>浸透圧比: <strong class="text-white">${data.s1.osm.toFixed(2)}</strong> ${data.s1.isDiluted ? '<span class="text-purple-300">(※希釈後)</span>' : ''}</div>
                            ` : '<div class="text-slate-500 italic mt-2">停止 / 未使用</div>'}
                        </div>
                        <div class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/60">
                            <div class="text-emerald-400 font-bold mb-1">側管 2 (${data.s2.name})</div>
                            ${data.s2.flow > 0 ? `
                                <div>流量: <strong class="text-white">${data.s2.flow} mL/h</strong></div>
                                <div>pH: <strong class="text-white">${data.s2.phMin.toFixed(2)} ～ ${data.s2.phMax.toFixed(2)}</strong></div>
                                <div>浸透圧比: <strong class="text-white">${data.s2.osm.toFixed(2)}</strong> ${data.s2.isDiluted ? '<span class="text-emerald-300">(※希釈後)</span>' : ''}</div>
                            ` : '<div class="text-slate-500 italic mt-2">停止 / 未使用</div>'}
                        </div>
                    </div>
                </div>

                <!-- STEP 2: 全流量 -->
                <div class="calc-card">
                    <div class="card-step-badge">STEP 2</div>
                    <h4 class="font-bold text-sky-300 text-sm mb-2">合流部 全流量の算出</h4>
                    <div class="math-box">
                        V<sub>total</sub> = ${flowFormula} = <strong class="text-sky-400 text-base">${data.totalFlow} mL/h</strong>
                    </div>
                </div>

                <!-- STEP 3: pH (水素イオン濃度加重平均) -->
                <div class="calc-card gradient-border-purple">
                    <div class="card-step-badge purple">STEP 3</div>
                    <h4 class="font-bold text-purple-300 text-sm mb-1">pH (水素イオン濃度加重平均) の詳細解析</h4>
                    <p class="text-xs text-slate-400 mb-3">※ pHは対数軸のため単純平均できません。[H<sup>+</sup>] = 10<sup>-pH</sup> に換算後、流量重み付け平均を行い、-log<sub>10</sub> でpHへ復元します。</p>
                    
                    <div class="ph-split-grid">
                        <!-- pH 最小値の展開 -->
                        <div class="ph-calc-card">
                            <div class="text-xs font-bold text-purple-300 mb-2">【pH 最小値 試算】</div>
                            <div class="text-xs font-mono mb-2">
                                [H<sup>+</sup>]<sub>avg</sub> = 
                                <div class="fraction-box">
                                    <div class="numerator">${phMinTerms.join(" + ")}</div>
                                    <div class="denominator">${data.totalFlow}</div>
                                </div>
                            </div>
                            <div class="text-[11px] text-slate-400 mb-2">↓ 平均 [H<sup>+</sup>] ≒ ${avgHMaxExp} mol/L</div>
                            <div class="code-line text-xs">
                                pH = -log<sub>10</sub>(${avgHMaxExp}) = <strong class="text-rose-400 text-sm">${data.finalPhMin.toFixed(2)}</strong>
                            </div>
                        </div>

                        <!-- pH 最大値の展開 -->
                        <div class="ph-calc-card">
                            <div class="text-xs font-bold text-purple-300 mb-2">【pH 最大値 試算】</div>
                            <div class="text-xs font-mono mb-2">
                                [H<sup>+</sup>]<sub>avg</sub> = 
                                <div class="fraction-box">
                                    <div class="numerator">${phMaxTerms.join(" + ")}</div>
                                    <div class="denominator">${data.totalFlow}</div>
                                </div>
                            </div>
                            <div class="text-[11px] text-slate-400 mb-2">↓ 平均 [H<sup>+</sup>] ≒ ${avgHMinExp} mol/L</div>
                            <div class="code-line text-xs">
                                pH = -log<sub>10</sub>(${avgHMinExp}) = <strong class="text-rose-400 text-sm">${data.finalPhMax.toFixed(2)}</strong>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3 text-center result-pill-purple text-xs">
                        予測合流部 pH 範囲 : <span class="text-rose-400 text-sm font-extrabold">${data.finalPhMin.toFixed(2)} ～ ${data.finalPhMax.toFixed(2)}</span>
                    </div>
                </div>

                <!-- STEP 4: 浸透圧比 加重平均 -->
                <div class="calc-card gradient-border-green">
                    <div class="card-step-badge green">STEP 4</div>
                    <h4 class="font-bold text-emerald-300 text-sm mb-1">浸透圧比の加重平均算出</h4>
                    <p class="text-xs text-slate-400 mb-3">浸透圧比は各液体の浸透圧比と流量の掛け合わせによる直接加重平均です。</p>
                    
                    <div class="math-box">
                        浸透圧比<sub>avg</sub> = 
                        <div class="fraction-box">
                            <div class="numerator">${osmTerms.join(" + ")}</div>
                            <div class="denominator">${data.totalFlow}</div>
                        </div>
                        = <strong class="text-emerald-400 text-base">${data.finalOsm.toFixed(2)}</strong>
                    </div>

                    <div class="mt-3 text-center result-pill-green text-xs">
                        予測合流部 浸透圧比 : <span class="text-emerald-300 text-sm font-extrabold">${data.finalOsm.toFixed(2)}</span>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadDrugData);
    </script>
</body>
</html>
